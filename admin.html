<body>
<div class="login" id="login">
<form id="loginForm" novalidate>
<img src="icon-192.png" alt="">
<h1>Carto Admin</h1>
<p>Gère les lieux et les soirées de l'app. Les modifications s'appliquent pour tout le monde.</p>
<label class="field"><span>Mot de passe admin</span><input class="in" type="password" id="pw" autocomplete="current-password"></label>
<p class="err" id="loginErr" hidden></p>
<button class="btn primary" type="submit" id="loginBtn">Se connecter</button>
<a class="link" href="./" style="text-align:center;text-decoration:none">Retour à l'app</a>
</form>
</div>
<div class="app" id="app" hidden>
<header class="top">
<div class="brand"><img src="icon-180.png" alt="">Carto <small>Admin</small></div>
<div class="seg" role="tablist">
<button id="tabPlaces" data-tab="places" aria-pressed="true">Lieux<b id="nPlaces"></b></button>
<button id="tabEvents" data-tab="events" aria-pressed="false">Soirées<b id="nEvents"></b></button>
</div>
<button class="qbtn" id="queueBtn" aria-expanded="true" aria-controls="queue">À valider <span class="badge zero" id="qCount" aria-live="polite">0</span></button>
<span class="spacer"></span>
<button class="btn primary" id="newBtn">Nouveau lieu</button>
<button class="link" id="settingsBtn">Réglages</button>
<button class="link" id="logout">Déconnexion</button>
</header>
<section class="queue" id="queue" aria-labelledby="qTitle" hidden></section>
<div class="main" id="main">
<aside class="listp">
<div class="tools">
<input class="in" type="search" id="q" placeholder="Rechercher un nom, une adresse…" aria-label="Rechercher">
<div class="chips" id="chips"></div>
<button class="btn" id="syncBtn">Mettre à jour les horaires depuis OpenStreetMap</button>
</div>
<ul class="rows" id="rows"></ul>
</aside>
<section class="detail" id="detail"><div class="placeholder">Choisis un lieu ou une soirée dans la liste.</div></section>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
