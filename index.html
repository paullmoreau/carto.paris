<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#eef1ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="La carte des bars et lieux où jouer au billard, aux fléchettes, au baby-foot, à la pétanque, au karaoké, aux quiz et plus encore, autour de toi.">
<title>Tournée Générale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Esprit iOS / Bump / Snap Map : carte claire et colorée plein écran, marqueurs emoji avec nom,
   commandes flottantes en verre dépoli en bas, pages « grouped » façon Apple avec grands titres. */
:root{
  --map:#eef1ee; --grouped:#f2f2f7; --card:#ffffff; --ink:#111114; --ink-2:#3a3a3f; --muted:#7a7a80;
  --line:rgba(60,60,67,.12); --fill:rgba(118,118,128,.12); --blue:#0a84ff; --black:#111114; --danger:#ff3b30;
  --glass:rgba(255,255,255,.74); --glass-line:rgba(255,255,255,.65);
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12);
  --shadow-lg:0 2px 6px rgba(0,0,0,.06),0 18px 50px rgba(0,0,0,.18);
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --gut:max(14px,env(safe-area-inset-left,0px));
  --gut-r:max(14px,env(safe-area-inset-right,0px));
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--map);color:var(--ink);font:16px/1.4 var(--sf);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--shadow);border:1px solid var(--glass-line)}
.emo{font-family:var(--emoji);line-height:1}

#map{position:fixed;inset:0;background:var(--map);z-index:0}
.leaflet-container{background:var(--map);font-family:var(--sf)}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)!important;border-radius:8px 0 0 0;color:var(--muted)}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-bottom.leaflet-right{bottom:var(--attr-b,0px);transition:bottom .3s}

/* ---------- Haut ---------- */
.top{position:fixed;z-index:20;top:calc(10px + var(--sat));left:var(--gut);right:var(--gut-r);display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.top > *{pointer-events:auto}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.round svg{width:21px;height:21px}
.round.on{color:var(--blue)}
.where{height:40px;border-radius:999px;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(120,120,128,.55);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:0}
.where .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Bas : pilules, catégories, recherche, onglets ---------- */
.bottom{position:fixed;z-index:35;left:0;right:0;bottom:0;padding:0 0 calc(10px + var(--sab));display:flex;flex-direction:column;gap:10px;pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .25s}
.bottom > *{pointer-events:auto}
.bottom::before{content:"";position:absolute;inset:-40px 0 0;background:linear-gradient(to bottom,rgba(238,241,238,0),rgba(238,241,238,.85) 45%,rgba(238,241,238,.95));pointer-events:none;z-index:-1}
.here{align-self:center;height:40px;padding:0 18px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(10,132,255,.4)}
.here svg{width:18px;height:18px}
.pills{display:flex;gap:8px;padding:0 var(--gut-r) 0 var(--gut);overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{height:38px;border-radius:999px;padding:0 15px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:15px;white-space:nowrap;flex:none;color:var(--ink)}
.pill svg{width:16px;height:16px}
.pill .chev{width:12px;height:12px;opacity:.6}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px var(--gut-r) 0 var(--gut);scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:5px;scroll-snap-align:start;transition:opacity .2s}
.cat .bub{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:32px;transition:transform .15s}
.cat .bub .emo{filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.cat .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;max-width:74px;overflow:hidden;text-overflow:ellipsis}
.cat .cnt{position:absolute;top:-4px;right:-6px;min-width:24px;height:20px;padding:0 6px;border-radius:999px;background:var(--black);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cat[aria-pressed="true"] .bub{background:var(--c);box-shadow:0 0 0 3px #fff,0 6px 16px color-mix(in srgb,var(--c) 55%,transparent)}
.cat[aria-pressed="true"] .lbl{color:var(--ink);font-weight:700}
.cats.filtering .cat[aria-pressed="false"]{opacity:.5}
.cat:active .bub{transform:scale(.92)}
.search{margin:0 var(--gut-r) 0 var(--gut);height:56px;border-radius:999px;background:var(--black);color:#fff;display:flex;align-items:center;padding:0 6px 0 22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:17px;color:#fff}
.search input::placeholder{color:rgba(255,255,255,.75)}
.search button{width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;flex:none}
.search button svg{width:20px;height:20px}
.tabs{align-self:center;height:64px;border-radius:999px;padding:6px;display:flex;gap:4px}
.tab{width:60px;height:52px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{background:var(--black);color:#fff}

/* ---------- Carte de détail (glisse depuis le bas) ---------- */
.card{position:fixed;z-index:40;left:10px;right:10px;bottom:calc(10px + var(--sab));max-height:calc(100% - 90px - var(--sat) - var(--sab));overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:32px;box-shadow:var(--shadow-lg);padding:18px 18px 18px;transform:translateY(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.9,.25,1);visibility:hidden}
.card.show{transform:none;visibility:visible}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.stack{display:flex;padding-left:6px}
.stack span{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--c);border:3px solid #fff;margin-left:-14px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.card-acts{display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.ibtn.fav-on{color:#ff2d55}
.card h2{margin:14px 0 2px;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere}
.card .kind{color:var(--muted);font-size:15.5px;font-weight:500}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.gchip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,#fff);font-weight:700;font-size:14px;color:var(--ink)}
.gchip .emo{font-size:18px}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tile{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:7px 12px;border-radius:12px;background:var(--grouped);font-size:14px;font-weight:600;color:var(--ink-2);max-width:100%;overflow-wrap:anywhere}
.tile svg{width:16px;height:16px;flex:none;color:var(--muted)}
.row-btns{display:flex;gap:8px}
.cta{flex:1;height:54px;border-radius:999px;background:var(--black);color:#fff;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.cta svg{width:20px;height:20px}
.cta.light{flex:none;padding:0 20px;background:var(--grouped);color:var(--ink)}
.cta.red{color:var(--danger)}
.src{font-size:12.5px;color:var(--muted);margin:12px 4px 0}
.src a{color:inherit}

/* ---------- Pages (liste, favoris, formulaire) ---------- */
.page{position:fixed;z-index:30;inset:0;background:var(--grouped);overflow-y:auto;overscroll-behavior:contain;padding:calc(18px + var(--sat)) var(--gut-r) calc(120px + var(--sab)) var(--gut);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.9,.25,1);visibility:hidden}
.page.show{transform:none;visibility:visible}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 4px 4px}
.ph h1{margin:0;font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-.035em}
.ph .meta{text-align:right;color:var(--muted);font-size:14px;font-weight:500;padding-top:8px}
.ph .meta b{color:var(--ink);display:block;font-size:15px}
.lead{margin:6px 4px 18px;color:var(--muted);font-size:15px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#b7b7bc;flex:none}
.dot.on{background:#34c759}
.seg{display:flex;gap:6px;margin:0 0 16px}
.seg button{height:36px;padding:0 14px;border-radius:999px;background:var(--card);font-weight:600;font-size:14.5px;color:var(--ink-2);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.seg button[aria-pressed="true"]{background:var(--black);color:#fff}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.folder{position:relative;height:118px;border-radius:22px;background:var(--c);padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.04)}
.folder::before{content:"";position:absolute;left:0;top:0;width:46%;height:20px;background:var(--c);filter:brightness(.92);border-radius:22px 12px 0 0}
.folder .emo{position:absolute;right:10px;top:10px;font-size:46px;transform:rotate(8deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.folder b{font-size:16px;font-weight:700;position:relative}
.folder small{font-size:13px;font-weight:500;opacity:.75;position:relative}
.folder[aria-pressed="true"]{box-shadow:0 0 0 3px var(--black)}
.folder[aria-pressed="true"]::after{content:"✓";position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--black);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.sec{margin:0 4px 10px;font-size:20px;font-weight:700;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-size:14px;color:var(--muted);font-weight:500}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;background:var(--card);border-radius:20px;text-align:left;min-height:68px}
.prow .ava{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:26px;flex:none;position:relative}
.prow .ava i{position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:#ffcc00}
.prow .tx{flex:1;min-width:0}
.prow .nm{display:block;font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.prow .sb{display:block;font-size:14px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.prow .ds{font-weight:600;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.more{display:block;margin:14px auto 0;height:44px;padding:0 22px;border-radius:999px;background:var(--card);font-weight:600}
.empty{background:var(--card);border-radius:24px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty .emo{font-size:44px;display:block;margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);margin:22px 6px 0;line-height:1.5}
.note a{color:inherit}
.err-line{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fff1f0;color:#b3261e;border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.err-line button{color:var(--blue);font-weight:700}

/* Formulaire */
.group{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:18px}
.group label.f{display:block;padding:12px 16px;border-bottom:1px solid var(--line)}
.group label.f:last-child{border-bottom:0}
.group .k{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px}
.group input[type=text],.group textarea{width:100%;border:0;outline:none;background:none;font-size:17px;padding:2px 0;resize:none}
.group textarea{min-height:66px}
.glabel{margin:0 6px 8px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.pk{height:40px;padding:0 14px 0 10px;border-radius:999px;background:var(--card);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px}
.pk .emo{font-size:19px}
.pk[aria-pressed="true"]{background:var(--c);box-shadow:inset 0 0 0 2px var(--black)}
.switch{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border-radius:20px;margin-bottom:18px;font-size:14.5px;color:var(--ink-2)}
.switch input{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:#e5e5ea;position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked{background:#34c759}
.switch input:checked::after{transform:translateX(20px)}
.ferr{color:var(--danger);font-size:13.5px;font-weight:600;margin:-10px 6px 14px}
.pos{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:12px 16px;margin-bottom:18px;font-weight:600}
.pos .emo{font-size:24px}
.pos small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.textbtn{height:40px;padding:0 14px;border-radius:999px;background:var(--card);font-weight:600;color:var(--blue)}

/* Recherche d'un lieu à ajouter (façon Google Maps) */
.sbox{display:flex;align-items:center;gap:10px;height:54px;padding:0 8px 0 16px;border-radius:18px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:12px}
.sbox > svg{width:20px;height:20px;color:var(--muted);flex:none}
.sbox input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:17px;-webkit-appearance:none;appearance:none}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sbox button{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none}
.sbox button svg{width:16px;height:16px}
.sugg{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.sg{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;background:var(--card);border-radius:18px;text-align:left;min-height:62px}
.sg .ava{width:44px;height:44px;border-radius:50%;background:var(--grouped);display:grid;place-items:center;font-size:23px;flex:none}
.sg .tx{flex:1;min-width:0}
.sg .nm{display:block;font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.sg .sb{display:block;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.sg .ds{font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sg:active,.prow:active{transform:scale(.98)}
.sg-info{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:18px;background:var(--card);color:var(--muted);font-size:14.5px}
.manual{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:transparent;border:1.5px dashed rgba(60,60,67,.25);text-align:left}
.manual .emo{font-size:24px}
.manual b{display:block;font-size:15.5px}
.manual small{display:block;color:var(--muted);font-size:13.5px}
.auto{display:flex;align-items:flex-start;gap:10px;margin:6px 0 18px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#eef4ff,#f6efff);color:var(--ink-2);font-size:14.5px;font-weight:500;line-height:1.4}
.auto .emo{font-size:18px}
.auto .spin{margin-top:2px}
.pk .sp{font-size:12px;margin-left:2px}

/* Placement */
.crosshair{position:fixed;z-index:12;left:var(--cross-x,50%);top:var(--cross-y,45%);transform:translate(-50%,-100%);pointer-events:none;font-size:46px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.crosshair::after{content:"";position:absolute;left:50%;bottom:-2px;width:12px;height:5px;margin-left:-6px;border-radius:50%;background:rgba(0,0,0,.28)}

/* Marqueurs façon Bump */
.mk{position:relative;width:46px;height:46px}
.mk .b{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:25px;box-shadow:0 3px 10px rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.9);transition:transform .15s}
.mk .st{position:absolute;right:-1px;top:-1px;width:13px;height:13px;border-radius:50%;background:var(--s);border:2px solid #fff}
.mk .lb{display:none;position:absolute;left:52px;top:50%;transform:translateY(-50%);width:max-content;max-width:160px;pointer-events:none;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 5px #fff,0 0 8px rgba(255,255,255,.9)}
.mk .lb b{display:block;font-size:13.5px;font-weight:700;line-height:1.15;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .lb i{display:block;font-size:12px;color:#55555c;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#map.labels .mk .lb{display:block}
.mk.sel .b{transform:scale(1.25);box-shadow:0 0 0 3px var(--black),0 8px 20px rgba(0,0,0,.25)}
.mk .dotm{display:none;position:absolute;left:17px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#map:not(.z16) .mk.anon:not(.sel) .dotm{display:block}
#map:not(.z16) .mk.anon:not(.sel) .b{display:none}
.cl{display:flex;align-items:center;height:44px;padding:0 10px 0 4px;border-radius:999px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.18);width:max-content;transform:translate(-50%,-50%)}
.cl span{width:36px;height:36px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:20px;border:2px solid #fff;margin-right:-10px}
.cl b{margin-left:16px;font-size:14px;font-weight:800}
.me{width:22px;height:22px;border-radius:50%;background:#0a84ff;border:3.5px solid #fff;box-shadow:0 0 0 8px rgba(10,132,255,.18),0 2px 6px rgba(0,0,0,.3)}

.toast{position:fixed;z-index:60;left:50%;top:calc(66px + var(--sat));transform:translate(-50%,-10px);opacity:0;background:var(--black);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* États de vue */
body:not([data-view="map"]) .bottom{transform:translateY(30px);opacity:0;pointer-events:none}
body:not([data-view="map"]) .bottom *{pointer-events:none}
body[data-view="list"] .bottom,body[data-view="fav"] .bottom{transform:none;opacity:1}
body[data-view="list"] .bottom > :not(.tabs),body[data-view="fav"] .bottom > :not(.tabs){visibility:hidden}
body[data-view="list"] .bottom .tabs,body[data-view="fav"] .bottom .tabs,body[data-view="list"] .bottom .tabs *,body[data-view="fav"] .bottom .tabs *{pointer-events:auto}
body[data-view="list"] .bottom::before,body[data-view="fav"] .bottom::before{display:none}
body[data-view="form"] .top,body[data-view="search"] .top,body[data-view="list"] .top,body[data-view="fav"] .top{opacity:0;pointer-events:none}

@media (min-width:900px){
  .bottom{left:auto;right:24px;width:460px;bottom:16px}
  .bottom::before{display:none}
  .card,.page{left:16px;right:auto;width:440px}
  .card{bottom:16px;max-height:calc(100% - 32px)}
  .page{top:16px;bottom:16px;height:auto;border-radius:32px;box-shadow:var(--shadow-lg);padding:28px 22px 40px;transform:translateX(-110%)}
  .page.show{transform:none}
  body[data-view="list"] .bottom > *,body[data-view="fav"] .bottom > *{visibility:visible}
  body[data-view="list"] .bottom *,body[data-view="fav"] .bottom *{pointer-events:auto}
  body[data-view="list"] .top,body[data-view="fav"] .top{opacity:1;pointer-events:auto}
  .top{left:480px}
  body[data-view="detail"] .bottom{transform:none;opacity:1}
  body[data-view] .bottom > *{visibility:visible}
  body[data-view] .bottom *{pointer-events:auto}
  body[data-view="place"] .bottom,body[data-view="form"] .bottom,body[data-view="search"] .bottom{opacity:0;transform:translateY(30px)}
  body[data-view="place"] .bottom *,body[data-view="form"] .bottom *,body[data-view="search"] .bottom *{pointer-events:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
(() => {
"use strict";
/* ================= Jeux ================= */
const CATS = [
  {id:"billard",label:"Billard",e:"🎱",color:"#30d158",re:/billiard|snooker|carom|pool_table/i,name:/billard|snooker/i},
  {id:"flechettes",label:"Fléchettes",e:"🎯",color:"#ff6961",re:/dart/i,name:/fl[ée]chette|\bdarts?\b/i},
  {id:"babyfoot",label:"Baby-foot",e:"⚽",color:"#5ac8fa",re:/table_soccer|table_football|foosball|kicker|babyfoot|baby_foot/i,name:/baby[- ]?foot/i},
  {id:"flipper",label:"Flipper",e:"🕹️",color:"#c79bff",re:/pinball|flipper/i,name:/flipper|pinball/i},
  {id:"beerpong",label:"Beer-pong",e:"🍺",color:"#ffb340",re:/beer_?pong/i,name:/beer[- ]?pong/i},
  {id:"societe",label:"Jeux de société",e:"🎲",color:"#ff8fab",re:/board_?game|boardgame|tabletop|club=board|club=games/i,name:/ludo|ludique|\bjeux\b|board ?game/i},
  {id:"echecs",label:"Échecs",e:"♟️",color:"#c7c7cc",re:/chess/i,name:/[ée]checs|chess/i},
  {id:"petanque",label:"Pétanque",e:"🔘",color:"#d9bf94",re:/boules|petanque|pétanque|bocce|sport=bowls/i,name:/p[ée]tanque|boulodrome/i},
  {id:"pingpong",label:"Ping-pong",e:"🏓",color:"#7ee0c3",re:/table_tennis/i,name:/ping[- ]?pong/i},
  {id:"karaoke",label:"Karaoké",e:"🎤",color:"#ffd60a",re:/karaoke/i,name:/karaok/i},
  {id:"quiz",label:"Quiz",e:"🧠",color:"#a5a3ff",re:/quiz|trivia/i,name:/quiz/i},
  {id:"arcade",label:"Arcade",e:"👾",color:"#64d2ff",re:/amusement_arcade|arcade|video_?game|retrogaming/i,name:/arcade|retro ?gaming/i},
  {id:"bowling",label:"Bowling",e:"🎳",color:"#ff9f80",re:/bowling|10pin|9pin/i,name:/bowling/i},
  {id:"autres",label:"Escape & golf",e:"⛳",color:"#b5e07a",re:/escape_game|escape_room|miniature_golf|minigolf|laser_?game|lasergame/i,name:/escape|mini[- ]?golf|laser ?game/i},
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const S = i => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${i}</svg>`;
const ICON = {
  close:S('<path d="M6 6l12 12M18 6L6 18"/>'),
  back:S('<path d="M15 18l-6-6 6-6"/>'),
  heart:S('<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/>'),
  heartFill:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/></svg>',
  route:S('<path d="M3 11l18-8-8 18-2-8z"/>'),
  pin:S('<path d="M12 21s7-6.2 7-11.5a7 7 0 1 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'),
  clock:S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  phone:S('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
  info:S('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  walk:S('<circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 3 3v3M8 12l3-4 3 2 3 1M12 15l-1-5"/>'),
  web:S('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>'),
  trash:S('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  ruler:S('<path d="M12 21s7-6.2 7-11.5a7 7 0 1 0-14 0C5 14.8 12 21 12 21z"/>'),
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
};

/* ================= Utilitaires ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("tg2:"+k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("tg2:"+k, JSON.stringify(v)); return true; }catch{ return false; } }
};
function dist(a, b){
  const R = 6371000, t = x => x*Math.PI/180;
  const h = Math.sin(t(b.lat-a.lat)/2)**2 + Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(t(b.lon-a.lon)/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtD = m => m < 1000 ? Math.max(10, Math.round(m/10)*10)+" m" : (m/1000).toFixed(m < 10000 ? 1 : 0).replace(".",",")+" km";
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
async function fetchJSON(url, opts = {}, ms = 15000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try{ const r = await fetch(url, {...opts, signal:c.signal}); if (!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3200); }

/* ================= Géocodage (Géoplateforme IGN, puis Nominatim) ================= */
async function geocode(q){
  try{
    const j = await fetchJSON("https://data.geopf.fr/geocodage/search?limit=1&q="+encodeURIComponent(q));
    const f = j.features && j.features[0];
    if (f && f.properties.score > 0.45) return {lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0], label:f.properties.label};
  }catch{}
  try{
    const j = await fetchJSON("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q="+encodeURIComponent(q));
    if (j[0]) return {lat:+j[0].lat, lon:+j[0].lon, label:j[0].display_name};
  }catch{}
  return null;
}
async function reverse(lat, lon){
  try{
    const j = await fetchJSON(`https://data.geopf.fr/geocodage/reverse?limit=1&lat=${lat}&lon=${lon}`, {}, 8000);
    const f = j.features && j.features[0]; if (f) return f.properties.label;
  }catch{}
  try{
    const j = await fetchJSON(`https://nominatim.openstreetmap.org/reverse?format=json&accept-language=fr&lat=${lat}&lon=${lon}`, {}, 8000);
    if (j.address){ const a = j.address; return [[a.house_number, a.road].filter(Boolean).join(" "), [a.postcode, a.city || a.town || a.village].filter(Boolean).join(" ")].filter(Boolean).join(", "); }
  }catch{}
  return "";
}

/* ================= OpenStreetMap (Overpass) ================= */
const KEY_RE = "billiard|snooker|dart|table_soccer|table_football|foosball|kicker|babyfoot|pinball|beer_pong|beerpong|board_game|chess|boules|petanque|table_tennis|karaoke|quiz|trivia|arcade|bowling";
function query(lat, lon, r){
  const a = `(around:${r},${lat.toFixed(5)},${lon.toFixed(5)})`;
  return `[out:json][timeout:45];(
nwr[~"${KEY_RE}"~".",i]${a};
nwr["sport"~"billiards|snooker|pool|darts|chess|boules|petanque|table_tennis|table_soccer|10pin|9pin|bowls|bowling"]${a};
nwr["leisure"~"^(amusement_arcade|bowling_alley|escape_game|miniature_golf|adult_gaming_centre)$"]${a};
nwr["amenity"~"^(karaoke_box|karaoke)$"]${a};
nwr["club"~"^(board_games|chess|games|billiards|darts)$"]${a};
nwr["shop"="games"]${a};
nwr["amenity"~"^(bar|pub|cafe|biergarten|nightclub|restaurant)$"]["name"~"billard|bowling|karaok|ludo|ludique|jeux|board ?game|arcade|flipper|fl[ée]chette|darts|quiz|escape|ping ?pong|p[ée]tanque|baby ?foot",i]${a};
);out center tags qt;`;
}
const ENDPOINTS = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];
async function overpass(q){
  let last;
  for (const u of ENDPOINTS){
    try{ return await fetchJSON(u, {method:"POST", body:"data="+encodeURIComponent(q), headers:{"Content-Type":"application/x-www-form-urlencoded"}}, 50000); }
    catch(e){ last = e; }
  }
  throw last;
}
const KIND = {bar:"Bar",pub:"Pub",cafe:"Café",biergarten:"Biergarten",nightclub:"Club",restaurant:"Restaurant",amusement_arcade:"Salle d'arcade",bowling_alley:"Bowling",escape_game:"Escape game",miniature_golf:"Mini-golf",adult_gaming_centre:"Salle de jeux",sports_centre:"Centre sportif",sports_hall:"Salle de sport",karaoke_box:"Karaoké box",games:"Boutique de jeux",community_centre:"Maison de quartier",park:"Parc"};
function osmKind(t){
  if (t.leisure === "pitch") return t.access === "private" ? "Terrain privé" : "Terrain en accès libre";
  if (t.shop === "games") return "Boutique / café ludique";
  if (t.club) return "Club";
  const k = t.amenity || t.leisure || t.shop || "";
  return KIND[k] || (k ? (k.charAt(0).toUpperCase()+k.slice(1)).replace(/_/g," ") : "Lieu");
}
function classify(t){
  const flat = Object.entries(t).filter(([k,v]) => v !== "no" && !/^(disused|was|not|removed|abandoned):/.test(k)).map(([k,v]) => k+"="+v).join("\n");
  const n = t.name || "";
  const g = CATS.filter(c => c.re.test(flat) || (n && c.name.test(n))).map(c => c.id);
  if ((t.shop === "games" || t.club === "board_games") && !g.includes("societe")) g.push("societe");
  return g;
}
function osmAddr(t){
  return [[t["addr:housenumber"], t["addr:street"]].filter(Boolean).join(" "), [t["addr:postcode"], t["addr:city"]].filter(Boolean).join(" ")].filter(Boolean).join(", ");
}
function fromOSM(el){
  const t = el.tags; if (!t) return null;
  const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon; if (lat == null) return null;
  if (t.leisure === "pitch" && t.access === "private") return null;
  const games = classify(t); if (!games.length) return null;
  const kind = osmKind(t);
  return {key:"o"+el.type[0]+el.id, src:"osm", lat, lon, games, kind,
    name: t.name || (t.leisure === "pitch" ? (games.includes("pingpong") ? "Table de ping-pong" : games.includes("petanque") ? "Terrain de pétanque" : games.includes("echecs") ? "Tables d'échecs" : "Terrain") : kind),
    named: !!t.name, address: osmAddr(t), hours: t.opening_hours || "", phone: t.phone || t["contact:phone"] || "",
    website: t.website || t["contact:website"] || "", url:`https://www.openstreetmap.org/${el.type}/${el.id}`};
}


/* ================= État ================= */
const S0 = {lat:48.8566, lon:2.3522};
const RADII = [1000, 3000, 5000, 10000];
const state = {
  active: new Set(store.get("filters", []).filter(id => CAT[id])),
  radius: RADII.includes(store.get("radius", 3000)) ? store.get("radius", 3000) : 3000,
  me:null, center:null, centerLabel:"", follow:true,
  osm:[], curated:[], mine: store.get("mine", []), favs: new Set(store.get("favs", [])),
  view:"map", prevView:"map", selected:null, shown:30, loading:false, error:false, draft:null
};
const isDesk = () => matchMedia("(min-width:900px)").matches;

/* ================= Carte ================= */
const map = L.map("map", {zoomControl:false, attributionControl:true, maxZoom:20, minZoom:3}).setView([S0.lat, S0.lon], 14);
map.attributionControl.setPrefix(false);
const OSM_ATTR = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
let base = null, baseOK = false;
function rasterBase(){
  if (base && base._raster) return;
  if (base) map.removeLayer(base);
  base = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {maxZoom:20, subdomains:"abcd",
    attribution: OSM_ATTR + ' · © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'}).addTo(map);
  base._raster = true;
}
function hasWebGL(){ try{ const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); }catch{ return false; } }
const mlLayer = (window.MaplibreGLLeaflet && MaplibreGLLeaflet.maplibreGL) || L.maplibreGL;
if (window.maplibregl && mlLayer && hasWebGL()){
  fetch("map-style.json").then(r => { if (!r.ok) throw 0; return r.json(); }).then(style => {
    base = mlLayer({style, interactive:false,
      attribution:'<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> · ' + OSM_ATTR}).addTo(map);
    base.getMaplibreMap().once("load", () => { baseOK = true; });
    setTimeout(() => { if (!baseOK) rasterBase(); }, 12000);
  }).catch(rasterBase);
} else rasterBase();

const cluster = L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:50, disableClusteringAtZoom:17, spiderfyOnMaxZoom:true,
  iconCreateFunction:c => {
    const seen = []; for (const m of c.getAllChildMarkers()){ const g = m.options.g; if (g && !seen.includes(g)) seen.push(g); if (seen.length === 3) break; }
    return L.divIcon({className:"", iconSize:[0,0], html:`<div class="cl">${seen.map(g => `<span class="emo" style="--c:${CAT[g].color}">${CAT[g].e}</span>`).join("")}<b>${c.getChildCount()}</b></div>`});
  }});
map.addLayer(cluster);
const ring = L.circle([S0.lat, S0.lon], {radius:state.radius, color:"#0a84ff", weight:1.5, opacity:.45, dashArray:"2 7", lineCap:"round", fill:false, interactive:false}).addTo(map);
let meMarker = null, meAcc = null;
const markers = new Map();
const draftLayer = L.layerGroup().addTo(map);
// noms à partir du zoom 15 ; les terrains sans nom restent de petites pastilles jusqu'au zoom 16
const labelsOn = () => { const c = map.getContainer(), z = map.getZoom(); c.classList.toggle("labels", z >= 15); c.classList.toggle("z16", z >= 16); };
map.on("zoomend", labelsOn); labelsOn();

/* ================= Données ================= */
function allPlaces(){
  const out = [...state.osm];
  for (const c of [...state.curated, ...state.mine]){
    if (c.lat == null) continue;
    const twin = c.src === "curated" && out.find(o => o.src === "osm" && o.named && dist(o, c) < 90 && (norm(o.name).includes(norm(c.name).split(" ")[0]) || norm(c.name).includes(norm(o.name))));
    if (twin){ twin.games = [...new Set([...twin.games, ...c.games])]; twin.note = twin.note || c.note; twin.srcUrl = c.source; continue; }
    out.push(c);
  }
  return out;
}
const findPlace = k => allPlaces().find(p => p.key === k);
const shownGames = p => state.active.size ? p.games.filter(g => state.active.has(g)) : p.games;
const ref = () => state.me || state.center || S0;
function inRadius(){
  const ctr = state.center || S0;
  return allPlaces().filter(p => p.src === "mine" || dist(ctr, p) <= state.radius * 1.02);
}
function visiblePlaces(){
  const r = ref();
  return inRadius().filter(p => shownGames(p).length).map(p => ({p, d:dist(r, p)}))
    .sort((a, b) => (b.p.src === "mine") - (a.p.src === "mine") || a.d - b.d);
}
const subOf = p => p.note && p.src !== "osm" ? p.kind.toLowerCase() : p.games.map(g => CAT[g].label.toLowerCase()).join(" · ");

/* ================= Marqueurs ================= */
function mkIcon(p, sel){
  const g = shownGames(p)[0] || p.games[0];
  const labelled = p.src !== "osm" || p.named;
  const status = p.src === "mine" ? "#ffcc00" : p.src === "curated" || p.srcUrl ? "#0a84ff" : "";
  return L.divIcon({className:"", iconSize:[46,46], iconAnchor:[23,23],
    html:`<div class="mk${sel ? " sel" : ""}${labelled ? "" : " anon"}" style="--c:${CAT[g].color}"><i class="dotm"></i><div class="b emo">${CAT[g].e}</div>${status ? `<span class="st" style="--s:${status}"></span>` : ""}${labelled ? `<div class="lb"><b>${esc(p.name)}</b><i>${esc(subOf(p))}</i></div>` : ""}</div>`});
}
function renderMarkers(vis){
  cluster.clearLayers(); markers.clear();
  cluster.addLayers(vis.map(({p}) => {
    const m = L.marker([p.lat, p.lon], {icon:mkIcon(p, state.selected === p.key), title:p.name, alt:p.name, g:shownGames(p)[0] || p.games[0], riseOnHover:true});
    m.on("click", () => openDetail(p.key));
    if (state.selected === p.key) m.setZIndexOffset(1500);
    markers.set(p.key, m); return m;
  }));
}

/* ================= Bas de l'écran ================= */
function renderBottom(){
  const pool = inRadius();
  const counts = {}; pool.forEach(p => p.games.forEach(g => counts[g] = (counts[g] || 0) + 1));
  const order = [...CATS].sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
  const cats = $("cats");
  cats.classList.toggle("filtering", state.active.size > 0);
  cats.innerHTML = `<button class="cat" data-id="" aria-pressed="${!state.active.size}" style="--c:#e5e5ea"><span class="bub emo">✨</span><span class="lbl">Tout</span></button>` +
    order.map(c => `<button class="cat" data-id="${c.id}" aria-pressed="${state.active.has(c.id)}" style="--c:${c.color}"><span class="bub"><span class="emo">${c.e}</span>${counts[c.id] ? `<span class="cnt">${counts[c.id] > 99 ? "99+" : counts[c.id]}</span>` : ""}</span><span class="lbl">${c.label}</span></button>`).join("");
  const n = visiblePlaces().length;
  $("pills").innerHTML = `<button class="pill glass" id="radiusPill" type="button">${ICON.ruler.replace("<svg", '<svg style="color:#0a84ff"')}${state.radius / 1000} km${ICON.chev}</button>
    <button class="pill glass" id="countPill" type="button">${state.loading ? '<span class="spin"></span>' : ""}${n} lieu${n > 1 ? "x" : ""} à voir</button>
    ${state.favs.size ? `<button class="pill glass" id="favPill" type="button"><span class="emo">❤️</span>${state.favs.size} favori${state.favs.size > 1 ? "s" : ""}</button>` : ""}`;
  const w = $("where");
  w.innerHTML = state.loading ? `<span class="spin"></span>Recherche…` : esc(state.me && !state.centerLabel ? "Autour de toi" : state.centerLabel ? state.centerLabel : "Paris");
}
$("cats").addEventListener("click", e => {
  const b = e.target.closest(".cat"); if (!b) return;
  toggleFilter(b.dataset.id);
});
function toggleFilter(id){
  if (!id) state.active.clear(); else state.active.has(id) ? state.active.delete(id) : state.active.add(id);
  store.set("filters", [...state.active]); state.shown = 30;
  render();
}
$("pills").addEventListener("click", e => {
  if (e.target.closest("#radiusPill")) setRadius(RADII[(RADII.indexOf(state.radius) + 1) % RADII.length]);
  else if (e.target.closest("#countPill")) go("list");
  else if (e.target.closest("#favPill")) go("fav");
});
function setRadius(r){
  state.radius = r; store.set("radius", r); state.shown = 30; ring.setRadius(r);
  fitCircle(); loadOSM();
}

/* ================= Zone libre de la carte ================= */
function freeRect(){
  const W = innerWidth, H = innerHeight;
  const topB = $("top").getBoundingClientRect().bottom + 8;
  let x0 = 0, y1 = H;
  const card = $("card"), page = $("page");
  if (isDesk()){
    if (card.classList.contains("show") || page.classList.contains("show")) x0 = 470;
  } else if (card.classList.contains("show")){
    y1 = H - card.offsetHeight - 20;
  } else if (state.view === "map"){
    const b = $("pills").getBoundingClientRect(); if (b.height) y1 = b.top - 8;
  }
  return {x0, y0:topB, x1:W, y1:Math.max(topB + 120, y1)};
}
function focusOn(lat, lon, zoom){
  const z = zoom || Math.max(map.getZoom(), 16), r = freeRect();
  const off = L.point((r.x0 + r.x1) / 2 - innerWidth / 2, (r.y0 + r.y1) / 2 - innerHeight / 2);
  map.setView(map.unproject(map.project([lat, lon], z).subtract(off), z), z, {animate:true});
}
function fitCircle(){
  const c = state.center || S0, r = freeRect();
  map.fitBounds(L.latLng(c.lat, c.lon).toBounds(state.radius * 2), {paddingTopLeft:[r.x0 + 10, r.y0], paddingBottomRight:[innerWidth - r.x1 + 10, innerHeight - r.y1 + 10], animate:true});
}
function syncAttr(){ document.documentElement.style.setProperty("--attr-b", (isDesk() || state.view !== "map" ? 0 : innerHeight - $("pills").getBoundingClientRect().top + 10) + "px"); }

/* ================= Vues ================= */
function go(view){
  if (view === "add"){ startAdd(); return; }
  state.view = view;
  if (view !== "detail") state.selected = null;
  render();
}
function render(){
  document.body.dataset.view = state.view;
  document.querySelectorAll(".tab").forEach(t => t.toggleAttribute("aria-current", t.dataset.tab === (state.view === "detail" ? state.prevView : state.view)));
  document.querySelectorAll(".tab[aria-current]").forEach(t => t.setAttribute("aria-current", "page"));
  renderBottom();
  const vis = visiblePlaces();
  renderMarkers(vis);
  const card = $("card"), page = $("page");
  if (state.view === "detail"){
    const p = findPlace(state.selected);
    if (!p){ state.view = state.prevView; return render(); }
    card.innerHTML = detailHTML(p); card.classList.add("show"); card.scrollTop = 0;
  } else if (state.view === "place"){
    card.innerHTML = placeHTML(); card.classList.add("show");
  } else card.classList.remove("show");
  if (state.view === "list"){ const st = page.scrollTop; page.innerHTML = listHTML(vis); page.classList.add("show"); page.scrollTop = st; }
  else if (state.view === "fav"){ page.innerHTML = favHTML(); page.classList.add("show"); }
  else if (state.view === "search"){ if (!page.querySelector("#ps")) page.innerHTML = searchHTML(); page.classList.add("show"); renderSugg(); }
  else if (state.view === "form"){ if (!page.querySelector("#addForm")) page.innerHTML = formHTML(); page.classList.add("show"); }
  else page.classList.remove("show");
  updateHere(); syncAttr();
}
document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  if (state.view === "detail") closeDetail(false);
  go(t.dataset.tab);
});

/* ================= Détail ================= */
function detailHTML(p){
  const facts = [
    p.address && `<span class="tile">${ICON.pin}${esc(p.address)}</span>`,
    `<span class="tile">${ICON.walk}${fmtD(dist(ref(), p))}${state.me ? " · " + Math.max(1, Math.round(dist(state.me, p) / 80)) + " min à pied" : ""}</span>`,
    p.hours && `<span class="tile">${ICON.clock}${esc(frHours(p.hours))}</span>`,
    p.phone && `<span class="tile" style="user-select:all">${ICON.phone}${esc(p.phone)}</span>`,
    p.note && `<span class="tile">${ICON.info}${esc(p.note)}</span>`,
  ].filter(Boolean).join("");
  const site = p.website && /^https?:\/\//i.test(p.website) ? p.website : "";
  const fav = state.favs.has(p.key);
  const src = p.src === "mine" ? "Ajouté par toi, visible seulement sur cet appareil."
    : p.src === "curated" ? `Sélection Tournée Générale d'après <a href="${esc(p.source)}" target="_blank" rel="noopener">ce guide</a>. Vérifie les horaires avant d'y aller.`
    : `Données <a href="${esc(p.url)}" target="_blank" rel="noopener">OpenStreetMap</a>${p.srcUrl ? `, complétées d'après <a href="${esc(p.srcUrl)}" target="_blank" rel="noopener">ce guide</a>` : ""}.`;
  return `<div class="card-top">
      <div class="stack">${p.games.slice(0, 4).map(g => `<span class="emo" style="--c:${CAT[g].color}">${CAT[g].e}</span>`).join("")}</div>
      <div class="card-acts">
        <button class="ibtn${fav ? " fav-on" : ""}" id="favBtn" aria-pressed="${fav}" aria-label="${fav ? "Retirer des favoris" : "Ajouter aux favoris"}">${fav ? ICON.heartFill : ICON.heart}</button>
        <button class="ibtn" id="closeCard" aria-label="Fermer">${ICON.close}</button>
      </div>
    </div>
    <h2>${esc(p.name)}</h2>
    ${norm(p.kind) !== norm(p.name) ? `<div class="kind">${esc(p.kind)}</div>` : ""}
    <div class="gchips">${p.games.map(g => `<span class="gchip" style="--c:${CAT[g].color}"><span class="emo">${CAT[g].e}</span>${CAT[g].label}</span>`).join("")}</div>
    <div class="tiles">${facts}</div>
    <div class="row-btns">
      <a class="cta" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">${ICON.route}Y aller</a>
      ${site ? `<a class="cta light" href="${esc(site)}" target="_blank" rel="noopener" aria-label="Site web">${ICON.web}</a>` : ""}
      ${p.src === "mine" ? `<button class="cta light red" id="delBtn" aria-label="Supprimer ce lieu">${ICON.trash}</button>` : ""}
    </div>
    <p class="src">${src}</p>`;
}
function openDetail(key){
  if (state.view === "place" || state.view === "form" || state.view === "search") return;
  const p = findPlace(key); if (!p) return;
  if (state.view !== "detail") state.prevView = state.view;
  const prev = state.selected; state.selected = key; state.view = "detail";
  state.follow = false; $("locate").classList.remove("on");
  document.body.dataset.view = "detail";
  $("page").classList.remove("show");
  const card = $("card"); card.innerHTML = detailHTML(p); card.classList.add("show"); card.scrollTop = 0;
  document.querySelectorAll(".tab").forEach(t => t.removeAttribute("aria-current"));
  [prev, key].forEach(k => { const m = markers.get(k), q = k && findPlace(k); if (m && q){ m.setIcon(mkIcon(q, k === key)); m.setZIndexOffset(k === key ? 1500 : 0); } });
  const m = markers.get(key);
  const doFocus = () => focusOn(p.lat, p.lon);
  if (m && !map.hasLayer(m)) cluster.zoomToShowLayer(m, () => requestAnimationFrame(doFocus));
  else requestAnimationFrame(doFocus);
  syncAttr();
  setTimeout(() => $("closeCard") && $("closeCard").focus({preventScroll:true}), 350);
}
function closeDetail(doRender = true){
  const k = state.selected; state.selected = null; state.view = state.prevView === "detail" ? "map" : state.prevView;
  const m = markers.get(k), q = k && findPlace(k); if (m && q){ m.setIcon(mkIcon(q, false)); m.setZIndexOffset(0); }
  if (doRender) render();
}
$("card").addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#closeCard")){ closeDetail(); return; }
  if (t.closest("#favBtn")){ toggleFav(state.selected); return; }
  if (t.closest("#delBtn")){ deleteMine(state.selected, t.closest("#delBtn")); return; }
  if (t.closest("#cancelAdd")){ endAdd(); return; }
  if (t.closest("#backSearch")){ $("crosshair").hidden = true; state.view = "search"; render(); setTimeout(() => $("ps") && $("ps").focus(), 380); return; }
  if (t.closest("#confirmPos")){ confirmPosition(); return; }
  if (t.closest("#meHere")){ if (state.me) focusOn(state.me.lat, state.me.lon, 18); else toast("Position indisponible pour l'instant"); }
});
map.on("click", () => { if (state.view === "detail") closeDetail(); });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ if (state.view === "detail") closeDetail(); else if (["place","form","search"].includes(state.view)) endAdd(); } });

function toggleFav(key){
  state.favs.has(key) ? state.favs.delete(key) : state.favs.add(key);
  store.set("favs", [...state.favs]);
  const p = findPlace(key); if (p && state.view === "detail"){ const st = $("card").scrollTop; $("card").innerHTML = detailHTML(p); $("card").scrollTop = st; }
  renderBottom();
  toast(state.favs.has(key) ? "Ajouté aux favoris" : "Retiré des favoris");
}
function deleteMine(key, btn){
  if (btn.dataset.confirm !== "1"){ btn.dataset.confirm = "1"; btn.innerHTML = "Supprimer ?"; btn.style.padding = "0 18px"; return; }
  state.mine = state.mine.filter(p => p.key !== key); store.set("mine", state.mine);
  state.favs.delete(key); store.set("favs", [...state.favs]);
  state.selected = null; state.view = "map"; render(); toast("Lieu supprimé");
}

/* ================= Pages ================= */
function rowHTML(p, d){
  const g = shownGames(p)[0] || p.games[0];
  return `<li><button class="prow" data-key="${p.key}"><span class="ava emo" style="--c:${CAT[g].color}">${CAT[g].e}${p.src === "mine" ? "<i></i>" : ""}</span>
    <span class="tx"><span class="nm">${esc(p.name)}</span><span class="sb">${esc(subOf(p))}</span></span>
    <span class="ds">${fmtD(d)}</span></button></li>`;
}
function listHTML(vis){
  const pool = inRadius();
  const counts = {}; pool.forEach(p => p.games.forEach(g => counts[g] = (counts[g] || 0) + 1));
  const cats = CATS.filter(c => counts[c.id]).sort((a, b) => counts[b.id] - counts[a.id]);
  const n = vis.length;
  let h = `<div class="ph"><h1>${state.me && !state.centerLabel ? "Autour<br>de toi" : esc(state.centerLabel || "Paris")}</h1>
      <div class="meta"><b>${n} lieu${n > 1 ? "x" : ""}</b>dans ${state.radius / 1000} km</div></div>
    <p class="lead"><span class="dot${state.me ? " on" : ""}"></span>${state.me ? "Position en direct" : "Position non partagée"}${state.loading ? ' · <span class="spin"></span> recherche…' : ""}</p>
    <div class="seg" role="group" aria-label="Rayon">${RADII.map(r => `<button data-r="${r}" aria-pressed="${state.radius === r}">${r / 1000} km</button>`).join("")}</div>`;
  if (state.error) h += `<div class="err-line">Les serveurs OpenStreetMap ne répondent pas.<button id="retry">Réessayer</button></div>`;
  if (cats.length) h += `<div class="folders">${cats.map(c => `<button class="folder" data-id="${c.id}" aria-pressed="${state.active.has(c.id)}" style="--c:${c.color}"><span class="emo">${c.e}</span><b>${c.label}</b><small>${counts[c.id]} lieu${counts[c.id] > 1 ? "x" : ""}</small></button>`).join("")}</div>`;
  h += `<div class="sec">${state.active.size ? "Pour tes jeux" : "Les plus proches"}${state.active.size ? `<small><button class="textbtn" id="clearF" style="height:30px">Tout voir</button></small>` : ""}</div>`;
  if (!n) h += `<div class="empty"><span class="emo">🔍</span><b>${state.loading ? "Recherche en cours…" : "Rien par ici"}</b>${state.loading ? "" : "Agrandis le rayon ou ajoute un lieu que tu connais."}</div>`;
  else {
    h += `<ul class="rows">${vis.slice(0, state.shown).map(({p, d}) => rowHTML(p, d)).join("")}</ul>`;
    if (n > state.shown) h += `<button class="more" id="more">Voir ${Math.min(30, n - state.shown)} de plus</button>`;
  }
  h += `<p class="note">Lieux issus d'<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, d'une sélection de guides parisiens et de tes ajouts.</p>`;
  return h;
}
function favHTML(){
  const r = ref();
  const favs = allPlaces().filter(p => state.favs.has(p.key)).map(p => ({p, d:dist(r, p)})).sort((a, b) => a.d - b.d);
  const missing = state.favs.size - favs.length;
  let h = `<div class="ph"><h1>Favoris</h1><div class="meta"><b>${state.favs.size}</b>enregistré${state.favs.size > 1 ? "s" : ""}</div></div><p class="lead">Tes spots préférés, sur cet appareil.</p>`;
  if (!state.favs.size) h += `<div class="empty"><span class="emo">❤️</span><b>Aucun favori pour l'instant</b>Ouvre un lieu et touche le cœur pour le garder ici.</div>`;
  else {
    h += `<ul class="rows">${favs.map(({p, d}) => rowHTML(p, d)).join("")}</ul>`;
    if (missing > 0) h += `<p class="note">${missing} favori${missing > 1 ? "s sont" : " est"} hors de la zone chargée. Cherche son quartier pour le revoir.</p>`;
  }
  return h;
}
$("page").addEventListener("click", e => {
  const t = e.target;
  const row = t.closest(".prow"); if (row){ openDetail(row.dataset.key); return; }
  const f = t.closest(".folder"); if (f){ toggleFilter(f.dataset.id); return; }
  const r = t.closest(".seg button"); if (r){ setRadius(+r.dataset.r); return; }
  if (t.closest("#clearF")){ toggleFilter(""); return; }
  if (t.closest("#more")){ state.shown += 30; render(); return; }
  if (t.closest("#retry")){ loadOSM(); return; }
  if (t.closest("#cancelForm")){ endAdd(); return; }
  if (t.closest("#movePos")){ const d = state.draft; draftLayer.clearLayers(); state.view = "place"; render(); placeCross(); requestAnimationFrame(() => { focusOn(d.lat, d.lon, 18); placeCross(); }); return; }
  const sg = t.closest(".sg"); if (sg){ pickSugg(+sg.dataset.i); return; }
  if (t.closest("#manual")){ startManual(); return; }
  if (t.closest("#psClear")){ const i = $("ps"); i.value = ""; onSearchInput(""); i.focus(); return; }
  const pk = t.closest(".pk");
  if (pk){ const g = state.draft.games, i = g.indexOf(pk.dataset.id); i < 0 ? g.push(pk.dataset.id) : g.splice(i, 1); pk.setAttribute("aria-pressed", i < 0); state.draft.gamesTouched = true; $("eGames").hidden = true; }
});

/* ================= Ajouter un lieu ================= */
/* 1. Recherche par nom (suggestions Photon, données OpenStreetMap, triées autour de toi)
   2. La carte va au point exact, l'utilisateur valide ou ajuste le repère
   3. Fiche OpenStreetMap du lieu lue automatiquement : adresse, horaires, téléphone, site, jeux connus */
const DAYS = {Mo:"lun", Tu:"mar", We:"mer", Th:"jeu", Fr:"ven", Sa:"sam", Su:"dim", PH:"jours fériés"};
function frHours(h){
  if (!h) return "";
  return h.replace(/24\/7/g, "24h/24").replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH)\b/g, d => DAYS[d])
    .replace(/\boff\b/gi, "fermé").replace(/\s*;\s*/g, " · ").replace(/(\d)-(\d)/g, "$1–$2").replace(/,\s*/g, ", ");
}
const POI_EMO = {bar:"🍸", pub:"🍺", cafe:"☕", restaurant:"🍽️", fast_food:"🍔", nightclub:"🪩", biergarten:"🍻", bowling_alley:"🎳", amusement_arcade:"👾", pitch:"🏟️", park:"🌳", sports_centre:"🏅", games:"🎲", hotel:"🏨"};
function photonEmoji(pr){
  const g = classify({name:pr.name || ""});
  if (g.length) return CAT[g[0]].e;
  return POI_EMO[pr.osm_value] || (pr.osm_key === "place" || pr.osm_key === "highway" ? "📍" : pr.osm_key === "building" ? "🏠" : "📍");
}
function photonAddr(pr){
  const street = [pr.housenumber, pr.street || (pr.osm_key === "highway" ? pr.name : "")].filter(Boolean).join(" ");
  const city = [pr.postcode, pr.city || pr.town || pr.village || pr.district].filter(Boolean).join(" ");
  return [street, city].filter(Boolean).join(", ");
}
let suggCtrl = null, suggT = null, suggList = [];
function searchHTML(){
  return `<div class="ph"><h1>Ajouter<br>un lieu</h1><button class="textbtn" id="cancelForm">Annuler</button></div>
    <p class="lead">Cherche le bar par son nom, on s'occupe du reste.</p>
    <div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <label class="sr" for="ps">Nom du lieu</label>
      <input id="ps" type="search" placeholder="Le Bar des Amis, Paris 11e…" autocomplete="off" enterkeyhint="search">
      <button type="button" id="psClear" aria-label="Effacer" hidden>${ICON.close}</button></div>
    <ul class="sugg" id="sugg" aria-live="polite"></ul>
    <button type="button" class="manual" id="manual"><span class="emo">📍</span><span><b>Placer le lieu à la main</b><small>S'il n'apparaît pas dans les résultats</small></span></button>`;
}
function renderSugg(status){
  const ul = $("sugg"); if (!ul) return;
  if (status === "loading" && !suggList.length){ ul.innerHTML = `<li class="sg-info"><span class="spin"></span>Recherche…</li>`; return; }
  if (status === "error"){ ul.innerHTML = `<li class="sg-info">La recherche ne répond pas. Réessaie ou place le lieu à la main.</li>`; return; }
  if (status === "empty"){ ul.innerHTML = `<li class="sg-info">Aucun résultat. Essaie un autre nom ou ajoute la ville.</li>`; return; }
  const r = ref();
  ul.innerHTML = suggList.map((f, i) => {
    const pr = f.properties, [lon, lat] = f.geometry.coordinates;
    return `<li><button type="button" class="sg" data-i="${i}"><span class="ava emo">${photonEmoji(pr)}</span>
      <span class="tx"><span class="nm">${esc(pr.name || photonAddr(pr) || "Lieu sans nom")}</span><span class="sb">${esc(photonAddr(pr) || pr.country || "")}</span></span>
      <span class="ds">${fmtD(dist(r, {lat, lon}))}</span></button></li>`;
  }).join("");
}
async function fetchSugg(q){
  if (suggCtrl) suggCtrl.abort();
  suggCtrl = new AbortController();
  const r = ref();
  renderSugg("loading");
  try{
    const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${r.lat.toFixed(4)}&lon=${r.lon.toFixed(4)}&limit=8&lang=fr`, {signal:suggCtrl.signal});
    if (!res.ok) throw 0;
    const j = await res.json();
    // on garde les lieux et adresses, pas les pays ou régions entières
    suggList = (j.features || []).filter(f => !["country","state","county"].includes(f.properties.type)).slice(0, 7);
    renderSugg(suggList.length ? "" : "empty");
  }catch(e){ if (e && e.name === "AbortError") return; suggList = []; renderSugg("error"); }
}
function onSearchInput(v){
  $("psClear").hidden = !v;
  clearTimeout(suggT);
  if (v.trim().length < 2){ suggList = []; $("sugg").innerHTML = ""; return; }
  suggT = setTimeout(() => fetchSugg(v.trim()), 280);
}
function pickSugg(i){
  const f = suggList[i]; if (!f) return;
  const pr = f.properties, [lon, lat] = f.geometry.coordinates;
  const isPoi = !!pr.name && !["place","highway","boundary","landuse","natural","waterway","railway"].includes(pr.osm_key);
  const d = state.draft;
  Object.assign(d, {name:isPoi ? pr.name : "", address:photonAddr(pr), lat, lon, picked:{lat, lon},
    osm:pr.osm_type && pr.osm_id ? {type:{N:"node", W:"way", R:"relation"}[pr.osm_type], id:pr.osm_id} : null,
    kind:"", hours:"", phone:"", website:"", auto:null, enriching:true});
  enrich(d);
  goPlace(lat, lon);
}
async function enrich(d){
  let t = null;
  if (d.osm && d.osm.type){
    try{ const j = await fetchJSON(`https://api.openstreetmap.org/api/0.6/${d.osm.type}/${d.osm.id}.json`, {}, 9000); t = j.elements && j.elements[0] && j.elements[0].tags; }catch{}
  }
  if (state.draft !== d) return;
  d.enriching = false;
  if (t){
    const games = classify(t).filter(g => !d.games.includes(g));
    d.auto = {hours:frHours(t.opening_hours), phone:t.phone || t["contact:phone"] || "", website:t.website || t["contact:website"] || "", kind:osmKind(t), games:classify(t)};
    if (!d.gamesTouched) d.games.push(...games);
    for (const k of ["hours","phone","website","kind"]) if (!d[k]) d[k] = d.auto[k];
    if (!d.address) d.address = osmAddr(t);
    if (!d.name && t.name) d.name = t.name;
  }
  if (state.view === "form") fillForm();
}
function goPlace(lat, lon){
  state.view = "place"; render(); placeCross();
  requestAnimationFrame(() => { focusOn(lat, lon, 18); placeCross(); });
}
function placeHTML(){
  const d = state.draft || {};
  const known = !!d.picked;
  return `<div class="card-top"><div class="stack"><span class="emo" style="--c:#ffd60a">📍</span></div>
      <div class="card-acts"><button class="ibtn" id="${known ? "backSearch" : "cancelAdd"}" aria-label="${known ? "Retour à la recherche" : "Annuler"}">${known ? ICON.back : ICON.close}</button></div></div>
    <h2>${known ? "C'est bien ici ?" : "Où est ce lieu ?"}</h2>
    <div class="kind">${known ? `<b style="color:var(--ink)">${esc(d.name || "Adresse choisie")}</b>${d.address ? "<br>" + esc(d.address) : ""}<br><span style="font-size:14px">Fais glisser la carte si le repère n'est pas pile dessus.</span>` : "Fais glisser la carte pour mettre le repère dessus."}</div>
    <div class="row-btns" style="margin-top:16px">${known ? "" : `<button class="cta light" id="meHere">${ICON.route}Ma position</button>`}<button class="cta" id="confirmPos">${known ? "Oui, c'est ici" : "C'est ici"}</button></div>`;
}
function formHTML(){
  const d = state.draft;
  return `<div class="ph"><h1>Nouveau<br>lieu</h1><button class="textbtn" id="cancelForm">Annuler</button></div>
    <div id="autoLine">${autoLine()}</div>
    <form id="addForm" novalidate>
      <div class="pos"><span class="emo">📍</span><span style="flex:1;min-width:0"><span id="addrPreview">${d.address ? esc(d.address) : "Position choisie sur la carte"}</span><small>Repère placé sur la carte</small></span><button type="button" class="textbtn" id="movePos">Modifier</button></div>
      <p class="glabel" id="lGames">On y joue à</p>
      <div class="pick" role="group" aria-labelledby="lGames" id="fGames">${pickHTML()}</div>
      <p class="ferr" id="eGames" hidden style="margin-top:4px">Choisis au moins un jeu.</p>
      <div class="group" style="margin-top:16px">
        <label class="f"><span class="k">Nom du lieu</span><input type="text" id="fName" maxlength="80" placeholder="Le Bar des Amis" value="${esc(d.name)}" autocomplete="off"></label>
        <label class="f"><span class="k">Adresse</span><input type="text" id="fAddr" maxlength="140" value="${esc(d.address)}" placeholder="Facultatif" autocomplete="street-address"></label>
        <label class="f"><span class="k">Horaires</span><input type="text" id="fHours" maxlength="160" value="${esc(d.hours)}" placeholder="Ex. mar–sam 18:00–02:00"></label>
        <label class="f"><span class="k">Téléphone</span><input type="text" id="fPhone" maxlength="40" value="${esc(d.phone)}" placeholder="Facultatif" inputmode="tel"></label>
        <label class="f"><span class="k">Site web</span><input type="text" id="fWeb" maxlength="200" value="${esc(d.website)}" placeholder="https://…" inputmode="url"></label>
      </div>
      <p class="ferr" id="eName" hidden>Donne un nom au lieu.</p>
      <div class="group"><label class="f"><span class="k">Infos sur les jeux</span><textarea id="fNote" maxlength="300" placeholder="Quiz le mardi à 20h, 2 billards au sous-sol, fléchettes électroniques…">${esc(d.note)}</textarea></label></div>
      <label class="switch"><input type="checkbox" id="fShare"${d.share ? " checked" : ""}><span>Proposer aussi ces jeux à OpenStreetMap pour que tout le monde les voie (note publique et anonyme).</span></label>
      <button class="cta" type="submit" style="width:100%">Enregistrer le lieu</button>
    </form>`;
}
function pickHTML(){
  const d = state.draft, auto = (d.auto && d.auto.games) || [];
  return CATS.map(c => `<button type="button" class="pk" data-id="${c.id}" style="--c:${c.color}" aria-pressed="${d.games.includes(c.id)}"><span class="emo">${c.e}</span>${c.label}${auto.includes(c.id) ? '<span class="sp" title="Indiqué sur OpenStreetMap">✨</span>' : ""}</button>`).join("");
}
function autoLine(){
  const d = state.draft;
  if (!d.picked) return `<p class="lead">Coche les jeux et complète ce que tu sais.</p>`;
  if (d.enriching) return `<p class="auto"><span class="spin"></span>Recherche des infos du lieu…</p>`;
  if (d.auto){
    const got = [d.auto.hours && "horaires", d.auto.phone && "téléphone", d.auto.website && "site web", d.auto.games.length && "jeux"].filter(Boolean);
    return `<p class="auto"><span class="emo">✨</span>${got.length ? `Adresse${got.length ? ", " + got.join(", ") : ""} remplis automatiquement. Vérifie-les, puis coche les jeux.` : "Adresse remplie automatiquement. Ce lieu n'a pas encore d'horaires connus : ajoute-les si tu les as."}</p>`;
  }
  return `<p class="auto"><span class="emo">✨</span>Adresse remplie automatiquement. Ajoute les horaires si tu les connais, puis coche les jeux.</p>`;
}
function fillForm(){
  const d = state.draft; if (!d || !$("addForm")) return;
  const set = (id, v) => { const el = $(id); if (el && !el.value && v) el.value = v; };
  set("fName", d.name); set("fAddr", d.address); set("fHours", d.hours); set("fPhone", d.phone); set("fWeb", d.website);
  if (d.address && $("addrPreview")) $("addrPreview").textContent = d.address;
  $("fGames").innerHTML = pickHTML();
  $("autoLine").innerHTML = autoLine();
}
function placeCross(){
  $("crosshair").hidden = false;
  requestAnimationFrame(() => {
    const r = freeRect(), s = document.documentElement.style;
    s.setProperty("--cross-y", ((r.y0 + r.y1) / 2) + "px");
    s.setProperty("--cross-x", ((r.x0 + r.x1) / 2) + "px");
  });
}
function startAdd(){
  if (state.view === "detail") closeDetail(false);
  state.draft = {name:"", games:[...state.active], address:"", note:"", share:false, lat:null, lon:null, hours:"", phone:"", website:"", kind:"", picked:null, osm:null, auto:null, enriching:false, gamesTouched:false};
  suggList = [];
  state.view = "search"; render();
  setTimeout(() => $("ps") && $("ps").focus(), 380);
}
function startManual(){
  const d = state.draft; d.picked = null; d.osm = null; d.auto = null;
  state.view = "place"; render(); placeCross();
  const c = map.getCenter();
  if (state.me && dist(state.me, {lat:c.lat, lon:c.lng}) < 3000) focusOn(state.me.lat, state.me.lon, 18);
  else map.setZoom(Math.max(map.getZoom(), 17));
}
function crossLatLng(){ const r = $("crosshair").getBoundingClientRect(); return map.containerPointToLatLng([r.left + r.width / 2, r.bottom - 2]); }
async function confirmPosition(){
  const ll = crossLatLng(), d = state.draft;
  const prev = d.lat != null ? {lat:d.lat, lon:d.lon} : null;
  d.lat = ll.lat; d.lon = ll.lng;
  const moved = !prev || dist(prev, {lat:ll.lat, lon:ll.lng}) > 25;
  $("crosshair").hidden = true; draftLayer.clearLayers();
  L.marker(ll, {icon:L.divIcon({className:"", iconSize:[46,46], iconAnchor:[23,23], html:'<div class="mk sel"><div class="b emo">📍</div></div>'}), interactive:false}).addTo(draftLayer);
  state.view = "form"; $("page").innerHTML = ""; render();
  setTimeout(() => { const el = d.name ? null : $("fName"); if (el) el.focus(); }, 420);
  if (moved && !(d.picked && dist(d.picked, {lat:ll.lat, lon:ll.lng}) < 25)){
    const a = await reverse(ll.lat, ll.lng);
    if (a && state.draft === d){ d.address = a; if ($("fAddr")) $("fAddr").value = a; if ($("addrPreview")) $("addrPreview").textContent = a; }
  }
}
$("page").addEventListener("input", e => {
  const d = state.draft; if (!d) return;
  const id = e.target.id, v = e.target.value;
  if (id === "ps") onSearchInput(v);
  if (id === "fName"){ d.name = v; $("eName").hidden = true; }
  if (id === "fAddr") d.address = v;
  if (id === "fHours") d.hours = v;
  if (id === "fPhone") d.phone = v;
  if (id === "fWeb") d.website = v;
  if (id === "fNote") d.note = v;
  if (id === "fShare") d.share = e.target.checked;
});
$("page").addEventListener("keydown", e => {
  if (e.target.id === "ps" && e.key === "Enter"){ e.preventDefault(); if (suggList.length) pickSugg(0); else if (e.target.value.trim().length > 1) fetchSugg(e.target.value.trim()); }
});
$("page").addEventListener("submit", e => { e.preventDefault(); saveDraft(); });
function endAdd(){
  state.draft = null; suggList = []; $("crosshair").hidden = true; draftLayer.clearLayers();
  $("page").innerHTML = ""; state.view = "map"; render();
}
async function saveDraft(){
  const d = state.draft; let ok = true;
  d.name = d.name.trim();
  if (!d.name){ $("eName").hidden = false; ok = false; }
  if (!d.games.length){ $("eGames").hidden = false; ok = false; }
  if (!ok){ if (!d.games.length) $("lGames").scrollIntoView({block:"center", behavior:"smooth"}); else { $("fName").focus(); $("fName").scrollIntoView({block:"center", behavior:"smooth"}); } return; }
  const web = d.website.trim();
  const p = {key:"m" + Date.now().toString(36), src:"mine", name:d.name, games:CATS.map(c => c.id).filter(id => d.games.includes(id)),
    lat:d.lat, lon:d.lon, kind:d.kind || "Lieu ajouté", address:d.address.trim(), note:d.note.trim(), hours:d.hours.trim(), phone:d.phone.trim(),
    website:web && !/^https?:\/\//i.test(web) ? "https://" + web : web, osm:d.osm || null};
  state.mine.push(p);
  const saved = store.set("mine", state.mine), share = d.share;
  endAdd();
  toast(saved ? "Lieu ajouté" : "Lieu ajouté pour cette visite. Ton navigateur bloque l'enregistrement durable.");
  openDetail(p.key);
  if (share){
    const text = `Lieu de jeux proposé via Tournée Générale.\nNom : ${p.name}\nJeux : ${p.games.map(g => CAT[g].label).join(", ")}${p.address ? "\nAdresse : " + p.address : ""}${p.note ? "\nInfos : " + p.note : ""}${p.osm ? `\nObjet OSM : https://www.openstreetmap.org/${p.osm.type}/${p.osm.id}` : ""}`;
    try{
      const r = await fetch("https://api.openstreetmap.org/api/0.6/notes.json", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:`lat=${p.lat}&lon=${p.lon}&text=${encodeURIComponent(text)}`});
      if (!r.ok) throw 0;
      toast("Lieu ajouté et proposé à OpenStreetMap");
    }catch{ toast("Lieu ajouté. L'envoi à OpenStreetMap a échoué, réessaie plus tard."); }
  }
}

/* ================= « Chercher ici » ================= */
function updateHere(){
  const r = freeRect(), c = map.containerPointToLatLng([(r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2]), ctr = state.center;
  $("here").hidden = !(state.view === "map" && ctr && dist(ctr, {lat:c.lat, lon:c.lng}) > Math.min(state.radius * 0.45, 600));
}
map.on("moveend", updateHere);
$("here").addEventListener("click", () => { const c = map.getCenter(); state.follow = false; $("locate").classList.remove("on"); setCenter(c.lat, c.lng, "Cette zone", false); });
map.on("dragstart", () => { if (state.follow){ state.follow = false; $("locate").classList.remove("on"); } });

/* ================= Chargement des lieux ================= */
let reqId = 0;
async function loadOSM(){
  const c = state.center || S0, r = state.radius, id = ++reqId;
  const ck = `${c.lat.toFixed(3)},${c.lon.toFixed(3)},${r}`;
  const cache = store.get("osm", null);
  if (cache && cache.k === ck && Date.now() - cache.t < 6 * 3600e3){ state.osm = cache.items; state.error = false; render(); return; }
  state.loading = true; state.error = false; render();
  try{
    const j = await overpass(query(c.lat, c.lon, r));
    if (id !== reqId) return;
    const seen = new Set();
    state.osm = j.elements.map(fromOSM).filter(p => p && !seen.has(p.key) && seen.add(p.key));
    if (!store.set("osm", {k:ck, t:Date.now(), items:state.osm})) store.set("osm", null);
  }catch{
    if (id !== reqId) return;
    state.error = true;
    if (cache && cache.items && dist(c, {lat:+cache.k.split(",")[0], lon:+cache.k.split(",")[1]}) < r) state.osm = cache.items;
  }finally{
    if (id === reqId){ state.loading = false; render(); }
  }
}
async function loadCurated(){
  let list = [];
  try{ list = await fetchJSON("places.json", {cache:"no-cache"}); }catch{ return; }
  const geo = store.get("geo", {});
  state.curated = list.map((x, i) => ({...x, key:"c"+i, src:"curated", kind:x.kind || "Lieu", lat:x.lat ?? geo[x.address]?.[0], lon:x.lon ?? geo[x.address]?.[1], hours:x.hours || "", phone:"", website:x.website || ""}));
  render();
  const todo = state.curated.filter(p => p.lat == null);
  let changed = false;
  for (let i = 0; i < todo.length; i += 5){
    await Promise.all(todo.slice(i, i + 5).map(async p => {
      const g = await geocode(p.address);
      if (g){ p.lat = g.lat; p.lon = g.lon; geo[p.address] = [g.lat, g.lon]; changed = true; }
    }));
    if (changed){ store.set("geo", geo); render(); changed = false; }
  }
}


/* ================= Recherche d'adresse ================= */
$("searchForm").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  $("q").blur();
  const g = await geocode(/france|\d{5}/i.test(q) ? q : q + ", France");
  if (!g){ toast(`« ${q} » introuvable. Essaie avec la ville ou le code postal.`); return; }
  state.follow = false; $("locate").classList.remove("on");
  $("q").value = "";
  setCenter(g.lat, g.lon, q.charAt(0).toUpperCase() + q.slice(1), true);
});
$("where").addEventListener("click", () => go("list"));
function setCenter(lat, lon, label, fit){
  state.center = {lat, lon}; state.centerLabel = label || "";
  ring.setLatLng([lat, lon]);
  if (state.view === "detail") closeDetail(false);
  if (fit !== false) fitCircle();
  state.shown = 30; loadOSM();
}

/* ================= Position en temps réel ================= */
function onPos(pos){
  const first = !state.me;
  state.me = {lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy};
  const ll = [state.me.lat, state.me.lon];
  if (!meMarker){
    meMarker = L.marker(ll, {icon:L.divIcon({className:"", html:'<div class="me"></div>', iconSize:[22,22]}), zIndexOffset:3000, keyboard:false, interactive:false}).addTo(map);
    meAcc = L.circle(ll, {radius:state.me.acc, color:"#0a84ff", weight:0, fillOpacity:.1, interactive:false}).addTo(map);
  } else { meMarker.setLatLng(ll); meAcc.setLatLng(ll).setRadius(state.me.acc); }
  if (first){ setCenter(state.me.lat, state.me.lon, "", true); return; }
  if (state.follow && state.view === "map"){
    if (dist(state.center, state.me) > state.radius * 0.4) setCenter(state.me.lat, state.me.lon, "", false);
    map.panTo(ll, {animate:true});
  }
  if (state.view === "list") render();
}
let errShown = false;
function onErr(err){
  if (state.me || errShown) return;
  errShown = true;
  if (!state.center) setCenter(S0.lat, S0.lon, "Paris", true);
  toast(err && err.code === 1 ? "Localisation refusée. Cherche une ville en bas." : "Position introuvable pour l'instant.");
}
let watchId = null;
function startGPS(){
  if (!("geolocation" in navigator)){ onErr({code:2}); return; }
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:15000, timeout:15000});
}
$("locate").addEventListener("click", () => {
  if (!state.me){ errShown = false; startGPS(); toast("Recherche de ta position…"); return; }
  if (state.view === "place"){ focusOn(state.me.lat, state.me.lon, 18); return; }
  state.follow = true; $("locate").classList.add("on");
  if (state.view !== "map" && !isDesk()) go("map");
  if (state.centerLabel || (state.center && dist(state.center, state.me) > 300)) setCenter(state.me.lat, state.me.lon, "", true);
  else focusOn(state.me.lat, state.me.lon, 16);
});
addEventListener("resize", () => { syncAttr(); updateHere(); });

/* ================= Démarrage ================= */
render();
loadCurated();
startGPS();
setTimeout(() => { if (!state.center) setCenter(S0.lat, S0.lon, "Paris", true); }, 6000);
})();
</script>
</body>
</html>
