<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tournée Générale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
/* Layout : carte plein écran, panneau "ardoise" à gauche (bas de l'écran sur mobile). */
:root{
  --bg:#f3f1ea; --panel:#fbfaf6; --ink:#1d2622; --muted:#5f6b65; --line:#dcd8cc;
  --felt:#1e4d3a; --felt-ink:#f3efe2; --accent:#c8372d; --chip:#ece8dc;
  --display:"Bungee",Impact,"Arial Black",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#18201c; --ink:#e9eee9; --muted:#9aa8a0; --line:#2b3631;
  --felt:#163a2c; --felt-ink:#efe9d6; --accent:#ef5a4c; --chip:#222c27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#18201c; --ink:#e9eee9; --muted:#9aa8a0; --line:#2b3631;
  --felt:#163a2c; --felt-ink:#efe9d6; --accent:#ef5a4c; --chip:#222c27; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:grid;grid-template-columns:380px 1fr;height:100%}
#map{height:100%;width:100%;background:var(--bg)}

#panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);z-index:500}
header.top{background:var(--felt);color:var(--felt-ink);padding:18px max(18px,env(safe-area-inset-left,0px)) 16px 18px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font:400 26px/1 var(--display);margin:0;letter-spacing:.5px;text-wrap:balance}
.tag{font-size:12px;opacity:.8;letter-spacing:.08em;text-transform:uppercase}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;border:0;border-radius:8px;padding:10px 12px;font:inherit;background:rgba(255,255,255,.12);color:var(--felt-ink)}
.search input::placeholder{color:rgba(243,239,226,.6)}
.search button,.iconbtn{border:0;border-radius:8px;padding:0 12px;background:rgba(255,255,255,.14);cursor:pointer;display:flex;align-items:center;gap:6px}
.search button:hover,.iconbtn:hover{background:rgba(255,255,255,.24)}
.status{font-size:13px;display:flex;align-items:center;gap:8px;min-height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa;flex:none}
.dot.live{background:#5fe08f;box-shadow:0 0 0 0 rgba(95,224,143,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(95,224,143,0)}100%{box-shadow:0 0 0 0 rgba(95,224,143,0)}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}

.controls{padding:14px 18px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mini{font-size:12px;border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 10px 5px 5px;cursor:pointer;font-size:13px;font-weight:500;transition:opacity .15s}
.chip .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c)}
.chip .ic svg{width:14px;height:14px}
.chip .n{font:500 11px var(--mono);color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.chip[aria-pressed="false"]{opacity:.55}
.chip[aria-pressed="false"] .ic{background:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.radius-val{font:500 13px var(--mono)}

#list{flex:1;overflow:auto;min-height:0;padding:6px 0 20px}
.count{padding:10px 18px 4px;font-size:13px;color:var(--muted)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 18px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.item:hover{background:var(--chip)}
.item .name{font-weight:650;min-width:0;overflow-wrap:anywhere}
.item .dist{font:500 13px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.item .meta{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.gico{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;background:var(--c)}
.gico svg{width:12px;height:12px}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}
.foot{font-size:11.5px;color:var(--muted);padding:12px 18px;border-top:1px solid var(--line)}
.foot a{color:inherit}

/* Carte */
.mapwrap{position:relative;min-width:0}
.fab{position:absolute;z-index:600;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.fab button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;display:grid;place-items:center}
.fab button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.fab svg{width:22px;height:22px}
#here{position:absolute;z-index:600;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:var(--felt);color:var(--felt-ink);padding:9px 16px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.25);cursor:pointer}
#loading{position:absolute;z-index:600;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Marqueurs */
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff}
.pin svg{transform:rotate(45deg);width:17px;height:17px;color:#fff}
.pin b{position:absolute;top:-8px;right:-8px;transform:rotate(45deg);background:var(--ink);color:var(--panel);font:600 10px var(--mono);border-radius:999px;padding:1px 5px;border:1.5px solid #fff}
.me{width:18px;height:18px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,124,246,.25)}
.cluster{width:40px;height:40px;border-radius:50%;background:var(--felt);color:var(--felt-ink);display:grid;place-items:center;font:600 13px var(--mono);border:3px solid color-mix(in srgb,var(--felt-ink) 70%,transparent);box-shadow:0 2px 8px rgba(0,0,0,.3)}

.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.leaflet-popup-content{margin:14px 16px;font:14px/1.45 var(--body);min-width:220px}
.pop h3{margin:0 0 2px;font-size:16px}
.pop .kind{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.pop .games{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.pop .g{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--chip);border-radius:999px;padding:2px 8px 2px 2px}
.pop dl{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.pop dt{color:var(--muted)}
.pop dd{margin:0;overflow-wrap:anywhere}
.pop .acts{display:flex;gap:6px;flex-wrap:wrap}
.pop .acts a{font-size:12.5px;font-weight:600;text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--felt);color:var(--felt-ink)}
.pop .acts a.alt{background:var(--chip);color:var(--ink)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{font-size:10px}

/* Mobile : panneau en tiroir bas */
#sheetToggle{display:none}
@media (max-width:760px){
  #app{display:block;position:relative}
  .mapwrap{position:absolute;inset:0}
  #panel{position:absolute;left:0;right:0;bottom:0;height:46%;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);transition:height .25s;padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
  #panel.full{height:88%}
  #panel.min{height:132px}
  header.top{border-radius:16px 16px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px));gap:8px}
  h1{font-size:20px}
  .tag{display:none}
  #sheetToggle{display:block;margin:0 auto;width:52px;height:18px;border:0;background:none;cursor:pointer;position:relative}
  #sheetToggle::after{content:"";position:absolute;left:10px;right:10px;top:7px;height:4px;border-radius:4px;background:rgba(243,239,226,.5)}
  .controls,.count,.item,.foot,.empty{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fab{bottom:calc(46% + 14px)}
  #panel.full ~ .mapwrap .fab,#panel.min ~ .mapwrap .fab{bottom:calc(146px)}
}
</style>
</head>
<body>
<div id="app">
  <aside id="panel" class="">
    <header class="top">
      <button id="sheetToggle" aria-label="Agrandir ou réduire le panneau"></button>
      <div class="brand"><h1>Tournée Générale</h1><span class="tag">Jeux de bistrot</span></div>
      <form class="search" id="searchForm" role="search">
        <input id="q" type="search" placeholder="Une ville, une adresse…" autocomplete="off" aria-label="Chercher un lieu">
        <button type="submit" aria-label="Chercher"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      </form>
      <div class="status"><span class="dot" id="gpsDot"></span><span id="gpsText">Recherche de ta position…</span></div>
    </header>

    <div class="controls">
      <div class="row"><span class="label">Jeux</span><span><button class="mini" id="all">Tout</button><button class="mini" id="none">Aucun</button></span></div>
      <div class="chips" id="chips"></div>
      <div class="row" style="margin-top:4px"><label class="label" for="radius">Rayon</label><span class="radius-val" id="radiusVal">2 km</span></div>
      <input type="range" id="radius" min="500" max="10000" step="500" value="2000">
    </div>

    <div id="list"></div>
    <div class="foot">Données <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>. Un bar manque ? <a href="https://www.openstreetmap.org/" target="_blank" rel="noopener">Ajoute-le sur OSM</a> avec les tags <code>billiards=yes</code>, <code>darts=yes</code>, <code>table_soccer=yes</code>…</div>
  </aside>

  <div class="mapwrap">
    <div id="map" aria-label="Carte des lieux"></div>
    <button id="here" hidden>Chercher dans cette zone</button>
    <div id="loading" hidden><span class="spin"></span><span id="loadingText">Chargement…</span></div>
    <div class="fab">
      <button id="follow" aria-pressed="true" title="Suivre ma position" aria-label="Suivre ma position"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
(() => {
"use strict";

/* ---------- Catégories de jeux ---------- */
const S = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const CATS = [
  {id:"billard",  label:"Billard",       color:"#1f7a4d", re:/billiard|snooker|carom|pool_table/i, name:/billard|snooker/i,
   icon:S('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>')},
  {id:"flechettes",label:"Fléchettes",   color:"#c8372d", re:/dart/i, name:/fl[ée]chette|darts?\b/i,
   icon:S('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>')},
  {id:"babyfoot", label:"Baby-foot",     color:"#2a6fb8", re:/table_soccer|table_football|foosball|kicker|babyfoot|baby_foot/i, name:/baby[- ]?foot/i,
   icon:S('<path d="M2 12h20"/><rect x="5.5" y="7" width="3" height="10" rx="1"/><rect x="15.5" y="7" width="3" height="10" rx="1"/>')},
  {id:"flipper",  label:"Flipper",       color:"#8a44c4", re:/pinball|flipper/i, name:/flipper|pinball/i,
   icon:S('<circle cx="16" cy="6" r="3"/><path d="M4 20l8-4.5"/><path d="M20 20l-5-3"/>')},
  {id:"beerpong", label:"Beer-pong",     color:"#d9822b", re:/beer_?pong/i, name:/beer[- ]?pong/i,
   icon:S('<path d="M6 4h12l-2 16H8z"/><path d="M7 9h10"/>')},
  {id:"societe",  label:"Jeux de société",color:"#b8476f", re:/board_?game|boardgame|tabletop|cafe=board|games=yes/i, name:/ludo|jeux|board ?game|game/i,
   icon:S('<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>')},
  {id:"echecs",   label:"Échecs",        color:"#4b5563", re:/chess/i, name:/[ée]checs|chess/i,
   icon:S('<circle cx="12" cy="6" r="3"/><path d="M9 20l1.5-9h3L15 20"/><path d="M6 20h12"/>')},
  {id:"petanque", label:"Pétanque",      color:"#9a6b2f", re:/boules|petanque|pétanque|bocce|sport=bowls/i, name:/p[ée]tanque|boulodrome/i,
   icon:S('<circle cx="8" cy="14" r="5"/><circle cx="17.5" cy="15.5" r="3.5"/><circle cx="17" cy="6" r="1.6" fill="currentColor"/>')},
  {id:"pingpong", label:"Ping-pong",     color:"#0f8a8a", re:/table_tennis/i, name:/ping[- ]?pong/i,
   icon:S('<circle cx="10" cy="10" r="6.5"/><path d="M14.8 14.8L20 20"/><circle cx="19" cy="5" r="1.6" fill="currentColor"/>')},
  {id:"karaoke",  label:"Karaoké",       color:"#d6406a", re:/karaoke/i, name:/karaok/i,
   icon:S('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/>')},
  {id:"quiz",     label:"Quiz",          color:"#c79a00", re:/quiz|trivia/i, name:/quiz/i,
   icon:S('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 1-1 1.7"/><circle cx="12" cy="16.8" r=".6" fill="currentColor"/>')},
  {id:"arcade",   label:"Arcade",        color:"#5b54d6", re:/amusement_arcade|arcade|video_?game|retrogaming/i, name:/arcade|retro ?gaming/i,
   icon:S('<rect x="4" y="15" width="16" height="5" rx="1.5"/><path d="M12 15V9"/><circle cx="12" cy="6.5" r="2.5"/>')},
  {id:"bowling",  label:"Bowling",       color:"#2e7d6b", re:/bowling|10pin|9pin/i, name:/bowling/i,
   icon:S('<path d="M12 3c-1.4 0-2 1.4-2 2.8 0 1.4 1 2 1 3.1 0 1-3 3-3 7 0 2.2 1.2 5.1 4 5.1s4-2.9 4-5.1c0-4-3-6-3-7 0-1.1 1-1.7 1-3.1C14 4.4 13.4 3 12 3z"/>')},
  {id:"autres",   label:"Escape & mini-golf", color:"#6e7f2a", re:/escape_game|escape_room|miniature_golf|minigolf|laser_?game|lasergame|blind_test/i, name:/escape|mini[- ]?golf|laser ?game|blind ?test/i,
   icon:S('<path d="M5 21V4"/><path d="M5 4h12l-3 4 3 4H5"/>')},
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));

/* ---------- Requête Overpass ---------- */
const KEY_RE = "billiard|snooker|dart|table_soccer|table_football|foosball|kicker|babyfoot|pinball|beer_pong|beerpong|board_game|chess|boules|petanque|table_tennis|karaoke|quiz|trivia|arcade|bowling";
function buildQuery(lat, lon, r){
  const a = `(around:${r},${lat.toFixed(5)},${lon.toFixed(5)})`;
  return `[out:json][timeout:30];(
  nwr[~"${KEY_RE}"~".",i]${a};
  nwr["sport"~"billiards|snooker|pool|darts|chess|boules|petanque|table_tennis|10pin|9pin|bowls|bowling"]${a};
  nwr["leisure"~"amusement_arcade|bowling_alley|escape_game|miniature_golf|adult_gaming_centre|pitch_and_putt"]${a};
  nwr["amenity"~"karaoke_box|karaoke"]${a};
  nwr["shop"="games"]${a};
  nwr["amenity"~"^(bar|pub|cafe|biergarten|nightclub)$"]["name"~"billard|bowling|karaok|ludo|jeux|board game|arcade|flipper|fl[ée]chette|quiz|escape",i]${a};
);out center tags;`;
}
const ENDPOINTS = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];

async function overpass(q){
  let lastErr;
  for (const url of ENDPOINTS){
    try{
      const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 35000);
      const res = await fetch(url, {method:"POST", body:"data="+encodeURIComponent(q), headers:{"Content-Type":"application/x-www-form-urlencoded"}, signal:ctrl.signal});
      clearTimeout(t);
      if (!res.ok) throw new Error("HTTP "+res.status);
      return await res.json();
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("Overpass indisponible");
}

/* ---------- Classification ---------- */
const KIND = {bar:"Bar",pub:"Pub",cafe:"Café",biergarten:"Biergarten",nightclub:"Boîte de nuit",restaurant:"Restaurant",fast_food:"Snack",
  amusement_arcade:"Salle d'arcade",bowling_alley:"Bowling",escape_game:"Escape game",miniature_golf:"Mini-golf",adult_gaming_centre:"Salle de jeux",
  pitch:"Terrain",sports_centre:"Centre sportif",park:"Parc",karaoke_box:"Karaoké",games:"Boutique de jeux",community_centre:"Maison de quartier",club:"Club"};
function classify(tags){
  const flat = Object.entries(tags).filter(([k,v]) => v !== "no" && !/^(disused|was|not):/.test(k)).map(([k,v]) => k+"="+v).join("\n");
  const name = tags.name || "";
  const games = CATS.filter(c => c.re.test(flat) || (name && c.name.test(name))).map(c => c.id);
  // un magasin de jeux / café ludique => jeux de société
  if (tags.shop === "games" && !games.includes("societe")) games.push("societe");
  return games;
}
function kindOf(t){
  const k = t.amenity || t.leisure || t.shop || t.club || "";
  let s = KIND[k] || (k ? k.replace(/_/g," ") : "Lieu");
  if (k === "pitch" && t.sport) s = "Terrain en accès libre";
  if (t.shop === "games") s = "Boutique / café ludique";
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function addr(t){
  const l1 = [t["addr:housenumber"], t["addr:street"]].filter(Boolean).join(" ");
  const l2 = [t["addr:postcode"], t["addr:city"]].filter(Boolean).join(" ");
  return [l1, l2].filter(Boolean).join(", ");
}

/* ---------- État ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("tg:"+k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("tg:"+k, JSON.stringify(v)); }catch{} }
};
let active = new Set(store.get("filters", CATS.map(c => c.id)).filter(id => CAT[id]));
let radius = store.get("radius", 2000);
let me = null;            // position GPS réelle {lat,lon,acc}
let center = null;        // centre de la dernière recherche
let places = [];
let follow = true;
let lastFetchPos = null;

/* ---------- Carte ---------- */
const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light" || document.documentElement.dataset.theme === "dark";
const map = L.map("map", {zoomControl:false}).setView([48.8566, 2.3522], 14);
L.control.zoom({position:"topleft"}).addTo(map);
L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark ? "dark_all" : "rastertiles/voyager"}/{z}/{x}/{y}{r}.png`, {
  maxZoom:20, subdomains:"abcd",
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover:false, maxClusterRadius:45, spiderfyOnMaxZoom:true,
  iconCreateFunction: c => L.divIcon({html:`<div class="cluster">${c.getChildCount()}</div>`, className:"", iconSize:[40,40]})
});
map.addLayer(cluster);
const radiusCircle = L.circle([0,0], {radius, color:"#c8372d", weight:1.5, dashArray:"6 6", fillOpacity:.04, interactive:false}).addTo(map);
let meMarker = null, meAcc = null;

/* ---------- UI : filtres ---------- */
const $ = id => document.getElementById(id);
function renderChips(){
  const counts = Object.fromEntries(CATS.map(c => [c.id, 0]));
  places.forEach(p => p.games.forEach(g => counts[g]++));
  $("chips").innerHTML = CATS.map(c => `
    <button class="chip" style="--c:${c.color}" data-id="${c.id}" aria-pressed="${active.has(c.id)}">
      <span class="ic">${c.icon}</span>${c.label}<span class="n">${counts[c.id]}</span>
    </button>`).join("");
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const id = b.dataset.id;
  active.has(id) ? active.delete(id) : active.add(id);
  store.set("filters", [...active]); render();
});
$("all").onclick = () => { active = new Set(CATS.map(c => c.id)); store.set("filters",[...active]); render(); };
$("none").onclick = () => { active = new Set(); store.set("filters",[]); render(); };

$("radius").value = radius;
const fmtR = r => r < 1000 ? r+" m" : (r/1000).toLocaleString("fr-FR")+" km";
$("radiusVal").textContent = fmtR(radius);
$("radius").addEventListener("input", e => { radius = +e.target.value; $("radiusVal").textContent = fmtR(radius); radiusCircle.setRadius(radius); });
$("radius").addEventListener("change", () => { store.set("radius", radius); if (center) search(center.lat, center.lon); });

/* ---------- Distances ---------- */
function dist(a, b){
  const R = 6371000, toR = x => x*Math.PI/180;
  const dLat = toR(b.lat-a.lat), dLon = toR(b.lon-a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtD = m => m < 1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(m < 10000 ? 1 : 0).replace(".",",")+" km";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Rendu ---------- */
function pinIcon(p, shown){
  const c = CAT[shown[0]];
  const more = shown.length > 1 ? `<b>+${shown.length-1}</b>` : "";
  return L.divIcon({className:"", iconSize:[34,34], iconAnchor:[17,41], popupAnchor:[0,-38],
    html:`<div class="pin" style="--c:${c.color}">${c.icon}${more}</div>`});
}
function popupHtml(p){
  const t = p.tags, a = addr(t);
  const rows = [
    a && ["Adresse", esc(a)],
    t.opening_hours && ["Horaires", esc(t.opening_hours)],
    (t.phone || t["contact:phone"]) && ["Tél.", esc(t.phone || t["contact:phone"])],
  ].filter(Boolean);
  const site = t.website || t["contact:website"] || t.url;
  const ref = me || center;
  return `<div class="pop">
    <h3>${esc(t.name || p.fallbackName)}</h3>
    <div class="kind">${esc(p.kind)}${ref ? " · à "+fmtD(dist(ref, p)) : ""}</div>
    <div class="games">${p.games.map(g => `<span class="g"><span class="gico" style="--c:${CAT[g].color}">${CAT[g].icon}</span>${CAT[g].label}</span>`).join("")}</div>
    ${rows.length ? `<dl>${rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : ""}
    <div class="acts">
      <a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">Itinéraire</a>
      ${site && /^https?:\/\//i.test(site) ? `<a class="alt" href="${esc(site)}" target="_blank" rel="noopener">Site web</a>` : ""}
      <a class="alt" href="https://www.openstreetmap.org/${p.type}/${p.id}" target="_blank" rel="noopener">Fiche OSM</a>
    </div></div>`;
}

let markerById = new Map();
function render(){
  renderChips();
  const ref = me || center;
  const visible = places
    .map(p => ({p, shown:p.games.filter(g => active.has(g))}))
    .filter(x => x.shown.length)
    .map(x => (x.d = ref ? dist(ref, x.p) : 0, x))
    .sort((a,b) => a.d - b.d);

  cluster.clearLayers(); markerById.clear();
  const ms = visible.map(({p, shown}) => {
    const m = L.marker([p.lat, p.lon], {icon:pinIcon(p, shown), title:p.tags.name || p.fallbackName});
    m.bindPopup(() => popupHtml(p), {maxWidth:300});
    markerById.set(p.key, m);
    return m;
  });
  cluster.addLayers(ms);

  const list = $("list");
  if (!places.length && !center){ list.innerHTML = ""; return; }
  if (!visible.length){
    list.innerHTML = `<div class="empty"><strong>${places.length ? "Aucun lieu avec ces filtres" : "Rien trouvé dans ce rayon"}</strong>${places.length ? "Active d'autres jeux ci-dessus." : "Agrandis le rayon ou cherche une autre zone."}</div>`;
    return;
  }
  list.innerHTML = `<div class="count">${visible.length} lieu${visible.length>1?"x":""} à moins de ${fmtR(radius)}</div>` +
    visible.slice(0, 300).map(({p, shown, d}) => `
    <button class="item" data-key="${p.key}">
      <span class="name">${esc(p.tags.name || p.fallbackName)}</span>
      <span class="dist">${ref ? fmtD(d) : ""}</span>
      <span class="meta">${shown.map(g => `<span class="gico" style="--c:${CAT[g].color}" title="${CAT[g].label}">${CAT[g].icon}</span>`).join("")}<span>${esc(p.kind)}</span></span>
    </button>`).join("");
}
$("list").addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  const m = markerById.get(b.dataset.key); if (!m) return;
  setFollow(false);
  cluster.zoomToShowLayer(m, () => m.openPopup());
  if (innerWidth <= 760) $("panel").className = "min";
});

/* ---------- Recherche ---------- */
let reqId = 0;
async function search(lat, lon){
  const id = ++reqId;
  center = {lat, lon};
  radiusCircle.setLatLng([lat, lon]).setRadius(radius);
  $("here").hidden = true;
  $("loading").hidden = false; $("loadingText").textContent = "Recherche des tables de jeu…";
  try{
    const data = await overpass(buildQuery(lat, lon, radius));
    if (id !== reqId) return;
    const seen = new Set();
    places = data.elements.map(el => {
      const la = el.lat ?? el.center?.lat, lo = el.lon ?? el.center?.lon;
      if (la == null || !el.tags) return null;
      const key = el.type+"/"+el.id; if (seen.has(key)) return null; seen.add(key);
      const games = classify(el.tags);
      if (!games.length) return null;
      const kind = kindOf(el.tags);
      return {key, id:el.id, type:el.type, lat:la, lon:lo, tags:el.tags, games, kind, fallbackName: kind};
    }).filter(Boolean);
    lastFetchPos = {lat, lon};
    render();
  }catch(e){
    if (id !== reqId) return;
    $("list").innerHTML = `<div class="empty"><strong>Impossible de charger les lieux</strong>Les serveurs OpenStreetMap sont peut-être saturés. Réessaie dans un instant.<br><br><button class="mini" id="retry">Réessayer</button></div>`;
    $("retry").onclick = () => search(lat, lon);
  }finally{
    if (id === reqId) $("loading").hidden = true;
  }
}

/* Bouton "Chercher dans cette zone" quand on déplace la carte */
map.on("moveend", () => {
  if (!center) return;
  const c = map.getCenter();
  $("here").hidden = dist(center, {lat:c.lat, lon:c.lng}) < radius*0.35;
});
map.on("dragstart", () => setFollow(false));
$("here").onclick = () => { const c = map.getCenter(); search(c.lat, c.lng); };

/* ---------- Géolocalisation temps réel ---------- */
function setFollow(v){ follow = v; $("follow").setAttribute("aria-pressed", v); }
$("follow").onclick = () => {
  if (!me){ startGPS(); return; }
  setFollow(true);
  map.flyTo([me.lat, me.lon], Math.max(map.getZoom(), 15));
  if (!lastFetchPos || dist(lastFetchPos, me) > radius*0.3) search(me.lat, me.lon);
};

function onPos(pos){
  const first = !me;
  me = {lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy};
  $("gpsDot").className = "dot live";
  $("gpsText").textContent = `Position en direct · précision ±${Math.round(me.acc)} m`;
  const ll = [me.lat, me.lon];
  if (!meMarker){
    meMarker = L.marker(ll, {icon:L.divIcon({className:"", html:'<div class="me"></div>', iconSize:[18,18]}), zIndexOffset:1000, keyboard:false}).addTo(map).bindTooltip("Vous êtes ici");
    meAcc = L.circle(ll, {radius:me.acc, color:"#2f7cf6", weight:1, fillOpacity:.08, interactive:false}).addTo(map);
  }else{ meMarker.setLatLng(ll); meAcc.setLatLng(ll).setRadius(me.acc); }

  if (first){ map.setView(ll, 15); search(me.lat, me.lon); return; }
  if (follow){
    map.panTo(ll, {animate:true});
    // on relance la recherche quand on s'est bien déplacé
    if (lastFetchPos && dist(lastFetchPos, me) > radius*0.4) search(me.lat, me.lon);
    else render(); // met à jour les distances en direct
  }else render();
}
function onErr(err){
  $("gpsDot").className = "dot";
  const msg = err.code === 1 ? "Localisation refusée" : "Position indisponible";
  $("gpsText").textContent = `${msg} · cherche une ville ci-dessus`;
  if (!center){ map.setView([48.8566, 2.3522], 14); search(48.8566, 2.3522); }
}
let watchId = null;
function startGPS(){
  if (!("geolocation" in navigator)){ onErr({code:2}); return; }
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:10000, timeout:20000});
}

/* ---------- Recherche d'adresse (Nominatim) ---------- */
$("searchForm").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q) return;
  $("loading").hidden = false; $("loadingText").textContent = "Recherche de l'adresse…";
  try{
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q="+encodeURIComponent(q));
    const [hit] = await r.json();
    if (!hit){ $("loading").hidden = true; $("gpsText").textContent = `« ${q} » introuvable`; return; }
    setFollow(false);
    const lat = +hit.lat, lon = +hit.lon;
    map.setView([lat, lon], 15);
    search(lat, lon);
  }catch{ $("loading").hidden = true; $("gpsText").textContent = "Recherche d'adresse indisponible"; }
});

/* ---------- Tiroir mobile ---------- */
$("sheetToggle").onclick = () => {
  const p = $("panel");
  p.className = p.className === "full" ? "min" : p.className === "min" ? "" : "full";
};

renderChips();
startGPS();
})();
</script>
</body>
</html>
